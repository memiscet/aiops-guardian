apiVersion: v1
kind: Namespace
metadata:
  name: stage4-lab
  labels:
    app.kubernetes.io/part-of: aiops-guardian
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crash-demo
  namespace: stage4-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crash-demo
  template:
    metadata:
      labels:
        app: crash-demo
    spec:
      containers:
        - name: demo
          image: busybox:1.36
          command: ["/bin/sh", "-c", "echo 'simulated missing config' >&2; exit 1"]
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 50m, memory: 32Mi}
