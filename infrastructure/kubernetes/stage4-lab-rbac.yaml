apiVersion: v1
kind: Namespace
metadata:
  name: stage4-lab
  labels:
    app.kubernetes.io/part-of: aiops-guardian
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: guardian-reader
  namespace: stage4-lab
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: guardian-readonly
  namespace: stage4-lab
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: guardian-readonly
  namespace: stage4-lab
subjects:
  - kind: ServiceAccount
    name: guardian-reader
    namespace: stage4-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: guardian-readonly
